services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mero
      POSTGRES_USER: mero
      POSTGRES_PASSWORD: mero
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mero"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DJANGO_ENV: dev
      DATABASE_URL: postgres://mero:mero@db:5432/mero
      SECRET_KEY: dev-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      ENV_FILE: /app/.env
      CREATE_SUPERUSER: "true"
      SUPERUSER_USERNAME: admin
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: admin
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
