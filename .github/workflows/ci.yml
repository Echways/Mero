name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mero
          POSTGRES_USER: mero
          POSTGRES_PASSWORD: mero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .

      - name: Tests
        env:
          PYTHONPATH: TimeTicket
          DJANGO_ENV: dev
          DATABASE_URL: postgres://mero:mero@localhost:5432/mero
          SECRET_KEY: ci-secret
          DEBUG: "False"
        run: |
          python TimeTicket/manage.py migrate
          pytest
