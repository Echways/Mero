[project]
name = "mero"
version = "0.1.0"
requires-python = ">=3.12"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["main", "TimeTicket"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "TimeTicket.settings"
django_find_project = false
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["TimeTicket"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "TimeTicket.settings"
