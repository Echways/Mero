services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mero
      POSTGRES_USER: mero
      POSTGRES_PASSWORD: mero
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mero"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DJANGO_ENV: prod
      DATABASE_URL: postgres://mero:mero@db:5432/mero
      SECRET_KEY: change-me
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost
      ENV_FILE: /app/.env
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /app/scripts/entrypoint_prod.sh

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_data:
  media_data:
