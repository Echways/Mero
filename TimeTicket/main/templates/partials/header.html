{% load static %}
<header class="header">
    <div class="container">
        <div class="header-inner">
            <div class="header-logo">
                <div class="logo"><img alt="logo" src="{% static 'img/logo.svg' %}"></div>
                <div class="logo-title">TimeTicket</div>
            </div>
            <nav>
                <a class="nav-link" href="{% url 'main' %}">главная</a>
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'profileview' %}">личный кабинет</a>
                    <form method="post" action="{% url 'logout' %}" class="nav-logout-form">
                        {% csrf_token %}
                        <button type="submit" class="nav-link nav-button">выйти</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">личный кабинет</a>
                {% endif %}
            </nav>
        </div>
    </div>
</header>
