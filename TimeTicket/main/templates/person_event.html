{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="eventcontainer">
        <div class="eventinner">
            {% for event in events %}
                {% include "partials/event_card.html" with event=event counter=forloop.counter %}
            {% empty %}
            <div>Событий пока нет.</div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock content%}
